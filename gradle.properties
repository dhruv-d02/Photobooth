# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# AndroidX
android.useAndroidX=true
# Kotlin Multiplatform
kotlin.mpp.stability.nowarn=true
# AGP 9.0+ introduced a new built-in-Kotlin/new-DSL model that isn't yet compatible with
# applying com.android.application directly alongside org.jetbrains.kotlin.multiplatform
# (the pattern composeApp/build.gradle.kts uses). This is AGP's own documented escape
# hatch back to the pre-9.0 behavior the KMP/Compose Multiplatform Gradle plugins
# currently expect.
#
# Root-level only because it has to be: moving these to composeApp/gradle.properties (to
# scope the opt-out to just that module) was tried and fails - AGP reads these properties
# before per-subproject gradle.properties files are in effect, at least for this specific
# check. If a future non-KMP module is added, it inherits this opt-out even though it
# doesn't need it - that's an accepted tradeoff, not an oversight.
#
# DEADLINE, not indefinite: AGP removes this opt-out entirely in AGP 10.0 (targeted
# mid-2026 per Android's own DSL/API migration timeline - see
# https://developer.android.com/build/releases/gradle-plugin-roadmap). Before bumping
# AGP past 9.x, confirm the Kotlin Multiplatform / Compose Multiplatform Gradle plugins
# support AGP 9's new DSL natively, then remove these two lines.
android.builtInKotlin=false
android.newDsl=false